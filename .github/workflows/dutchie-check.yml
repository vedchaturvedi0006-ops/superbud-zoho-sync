name: Dutchie key check

on:
  workflow_dispatch:             # run by hand: Actions -> Dutchie key check -> Run workflow

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test Dutchie keys (reads only)
        env:
          # Settings -> Secrets and variables -> Actions -> Secrets
          DUTCHIE_KEY_BENSON: ${{ secrets.DUTCHIE_KEY_BENSON }}
          DUTCHIE_KEY_RIVER: ${{ secrets.DUTCHIE_KEY_RIVER }}
          DUTCHIE_KEY_DOWNTOWN: ${{ secrets.DUTCHIE_KEY_DOWNTOWN }}
          DUTCHIE_KEY_EASTSIDE: ${{ secrets.DUTCHIE_KEY_EASTSIDE }}
          QUIET_OUTPUT: "true"       # public logs: no names, money or customer data
        run: python -m sbsync dutchie-check
