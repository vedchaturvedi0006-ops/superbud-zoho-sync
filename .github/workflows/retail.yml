name: Dutchie sales to Zoho

on:
  schedule:
    - cron: "23 */6 * * *"      # every 6 hours (backup; cron-job.org also starts it every 6 hours)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Load ALL sales history (first time only, takes longer)"
        type: boolean
        default: false
      stores:
        description: "Only these stores for the sales pull, e.g. downtown,eastside (empty = all)"
        type: string
        default: ""
      from_year:
        description: "Backfill: first year to load (e.g. 2026 for this year only; empty = 2018)"
        type: string
        default: ""

concurrency:
  group: dutchie-retail-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retail:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dutchie sales -> Zoho Retail Sales Stats
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          DUTCHIE_KEY_BENSON: ${{ secrets.DUTCHIE_KEY_BENSON }}
          DUTCHIE_KEY_RIVER: ${{ secrets.DUTCHIE_KEY_RIVER }}
          DUTCHIE_KEY_DOWNTOWN: ${{ secrets.DUTCHIE_KEY_DOWNTOWN }}
          DUTCHIE_KEY_EASTSIDE: ${{ secrets.DUTCHIE_KEY_EASTSIDE }}
          LIVE: ${{ vars.LIVE || 'false' }}
          RETAIL_TIMEZONE: ${{ vars.RETAIL_TIMEZONE || 'America/Phoenix' }}
          QUIET_OUTPUT: "true"       # public logs: counts only, no names or money
          STORES_ONLY: ${{ inputs.stores || '' }}
          RETAIL_HISTORY_FROM_YEAR: ${{ inputs.from_year || '2018' }}
        run: python -m sbsync retail ${{ inputs.backfill && '--backfill' || '' }} ${STORES_ONLY:+--stores=$STORES_ONLY}
